<!doctype html>
<html lang="pt-BR" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Google Fonts: Poppins (Títulos) + Plus Jakarta Sans / Inter (Corpo refinado & legível) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ana Luiza | Nutricionista</title>
    <script>
      (function () {
        var tema = localStorage.getItem('theme')
        var escuro = tema === 'dark' || (!tema && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (escuro) document.documentElement.classList.add('dark')
      })()
    </script>
  </head>
  <body class="bg-[#EFE9D2]/40 text-[#2B3318] antialiased selection:bg-[#EEA4C2]/40 selection:text-[#5E6B1E]">

    <script type="module" src="/src/main.tsx"></script>
  </body>
